apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: task-manager-ns

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: riya9421/mern-task-manager-backend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
           - name: PORT
             valueFrom:
              configMapKeyRef:
                name: task-manager-configmap
                key: PORT

           - name: NODE_ENV
             valueFrom:
              configMapKeyRef:
                name: task-manager-configmap
                key: NODE_ENV

           - name: MONGODB_URL
             valueFrom:
              configMapKeyRef:
                name: task-manager-configmap
                key: MONGODB_URL

           - name: ACCESS_TOKEN_SECRET
             valueFrom:
              secretKeyRef:
                name: task-manager-secrets
                key: ACCESS_TOKEN_SECRET


