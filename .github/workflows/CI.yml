# goal: create a ci workfolow for a node.js project MARN task manger 

name: MERN Task Manager CI

on:
  push:
    
jobs:
  ci:
    name: build and test
    runs-on: ubuntu-latest

    steps:
    #checkout the code
    - name: checkout code
      uses: actions/checkout@v7

     #set up node.js
    - name: set up node.js
      uses: actions/setup-node@v4
      with:
         node-version: '20' # Specify your required Node version
         cache: "npm" # Cache npm dependencies
         cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

    #install  frontend dependencies
    - name: install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    # run frontend tests
    - name: run frontend tests
      working-directory: ./frontend
      run: npm test -- --watchAll=false --passWithNoTests  
    
    # build the frontend
    - name: build frontend
      working-directory: ./frontend
      run: npm run build

    #install backend dependencies
    - name: install backend dependencies
      working-directory: ./backend
      run: npm ci

    #check backend syntax
    - name: check backend syntax
      run: node --check backend/app.js   

       # 8. Check Docker Hub username
    - name: Check Docker Hub configuration
      run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME secret is not configured."
            exit 1
          fi

          echo "Docker Hub username is configured."
          
   #build backend docker image
   # - name: build backend docker image
   #   run: docker build -t mern-task-manager-backend:ci ./backend
   
   # build frontend docker image
   # - name: build frontend docker image
    #  run: docker build -t mern-task-manager-frontend:ci ./frontend
    # login to docker hub
    - name: login to docker hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

   # - name: set up Buildx
   #   uses: docker/setup-buildx-action@v4

     # 9. Build backend image
    - name: Build backend Docker image
      working-directory: ./backend
      run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-task-manager-backend:latest .

  # 10. Build frontend image
    - name: Build frontend Docker image
      working-directory: ./frontend
      run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/mern-task-manager-frontend:latest .

     # 11. Push backend image
    - name: Push backend image
      run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-task-manager-backend:latest     

     # 12. Push frontend image
    - name: Push frontend image
      run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-task-manager-frontend:latest      